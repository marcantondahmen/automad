server {
    listen 80;
    server_name localhost;

    root /app;
    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Mirror the blocked files of the .htaccess files. Like in the .htaccess, only existing files are blocked,
    # so that page URLs such as "/blog/data" are still passed on to Automad.
    # Blocked files are rewritten to "/_", which never exists, so that Automad renders its 404 page.
    location ~* "(?x)
        ^/(config|lib)/
        | ^/automad/(console$|src/|lang/)
        | /(data|index)$
        | /\.history$
        | /shared/components$
        | /(packages|vendor)/.*\.(ts|less|md|sh|xml|json|lock)$
        | /vendor/.*(readme|license)
        | /(package|package-lock|composer)\.(json|lock)$
    " {
        if (-e $request_filename) {
            rewrite ^ /index.php?/_ last;
        }

        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Only the front controller is executed.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
